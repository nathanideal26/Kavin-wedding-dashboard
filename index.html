        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #fffcf5 0%, #fff7e6 50%, #fef3c7 100%);
            min-height: 100vh;
        }
        .gold-border {
            border: 1px solid #eab308;
        }
        .gold-glow {
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.25);
        }
        .font-cinzel {
            font-family: 'Cinzel', serif;
        }

        /* Indian Festive Header Background */
        .ganesha-header-bg {
            background: linear-gradient(to bottom, rgba(255, 240, 245, 0.75), rgba(254, 215, 170, 0.85)), url('https://i.ibb.co/mVZy9bM8/vibrant-indian-festive-background-with-intricate-decorations-1220676-34587.avif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* Mandala Line Art Overlay */
        .mandala-overlay {
            background-image: radial-gradient(circle at 50% 100%, rgba(225, 29, 72, 0.08) 0%, transparent 60%),
                              repeating-radial-gradient(circle at 50% 120%, transparent 0, transparent 20px, rgba(217, 119, 6, 0.05) 20px, rgba(217, 119, 6, 0.05) 40px);
        }

        /* Animated Glowing Text Effects */
        @keyframes headerPulseGlow {
            0%, 100% {
                text-shadow: 0 0 8px rgba(234, 179, 8, 0.6), 0 0 18px rgba(202, 138, 4, 0.4);
                filter: drop-shadow(0 0 6px rgba(254, 240, 138, 0.9));
            }
            50% {
                text-shadow: 0 0 16px rgba(234, 179, 8, 0.95), 0 0 32px rgba(202, 138, 4, 0.8);
                filter: drop-shadow(0 0 14px rgba(253, 224, 71, 1));
            }
        }

        @keyframes clockSparkleGlow {
            0%, 100% {
                box-shadow: 0 0 15px rgba(234, 179, 8, 0.4), inset 0 0 10px rgba(254, 240, 138, 0.6);
            }
            50% {
                box-shadow: 0 0 25px rgba(234, 179, 8, 0.8), inset 0 0 15px rgba(254, 240, 138, 0.9);
            }
        }

        .glow-title {
            animation: headerPulseGlow 3s infinite ease-in-out;
            color: #78350f;
        }
        .glow-subtitle {
            text-shadow: 0 0 8px rgba(234, 179, 8, 0.7);
            color: #92400e;
        }
        .glow-clock {
            animation: clockSparkleGlow 2.5s infinite ease-in-out;
        }

        /* Ribbon Banner Styles */
        .ribbon-banner {
            background: linear-gradient(90deg, #78350f 0%, #d97706 15%, #fef08a 50%, #d97706 85%, #78350f 100%);
            box-shadow: 0 4px 18px rgba(180, 83, 9, 0.4), inset 0 0 12px rgba(254, 240, 138, 0.8);
        }
        .ribbon-end-left {
            clip-path: polygon(100% 0, 0 50%, 100% 100%);
        }
        .ribbon-end-right {
            clip-path: polygon(0 0, 100% 50%, 0 100%);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #fef3c7;
        }
        ::-webkit-scrollbar-thumb {
            background: #ca8a04;
            border-radius: 9999px;
        }

        // Global Helper Functions Exposed to Window
        window.switchBranch = function(branch) {
            window.currentBranch = branch;
            const templeBtn = document.getElementById('btn-branch-temple');
            const recBtn = document.getElementById('btn-branch-reception');
            const titleText = document.getElementById('branch-title-text');
            const dateText = document.getElementById('branch-date-text');
            const venueText = document.getElementById('branch-venue-text');

            if (branch === 'TEMPLE') {
                templeBtn.className = "flex-1 sm:flex-none px-2.5 py-1.5 text-2xs sm:text-xs font-cinzel font-bold rounded-lg transition bg-amber-700 text-white shadow-xs border border-amber-400 hover:bg-amber-600 truncate";
                recBtn.className = "flex-1 sm:flex-none px-2.5 py-1.5 text-2xs sm:text-xs font-cinzel font-bold rounded-lg transition bg-amber-100/90 text-amber-950 border border-amber-300 hover:bg-amber-200 truncate";
                titleText.innerText = "TEMPLE WEDDING CEREMONY";
                dateText.innerText = "📅 23 AUG 2026";
                venueText.innerText = "📍 Jalan Baru Muniswarar Temple";
            } else {
                recBtn.className = "flex-1 sm:flex-none px-2.5 py-1.5 text-2xs sm:text-xs font-cinzel font-bold rounded-lg transition bg-rose-800 text-white shadow-xs border border-rose-400 hover:bg-rose-700 truncate";
                templeBtn.className = "flex-1 sm:flex-none px-2.5 py-1.5 text-2xs sm:text-xs font-cinzel font-bold rounded-lg transition bg-amber-100/90 text-amber-950 border border-amber-300 hover:bg-amber-200 truncate";
                titleText.innerText = "WEDDING RECEPTION (#CynNavTiedInLove)";
                dateText.innerText = "📅 24 AUG 2026";
                venueText.innerText = "📍 Ballroom 3, PICCA Convention Centre";
            }
            window.renderActiveView();
        };

        window.switchTab = function(tab) {
            window.currentTab = tab;
            ['agenda', 'details', 'transport', 'checklist'].forEach(t => {
                const btn = document.getElementById(`tab-btn-${t}`);
                const view = document.getElementById(`tab-view-${t}`);
                if (btn && view) {
                    if (t === tab) {
                        btn.className = "tab-btn font-cinzel font-bold text-2xs sm:text-xs px-2.5 sm:px-4 py-2 rounded-lg transition flex items-center gap-1 shadow-2xs bg-gradient-to-r from-amber-600 to-amber-700 text-white border border-amber-600 whitespace-nowrap";
                        view.classList.remove('hidden');
                    } else {
                        btn.className = "tab-btn font-cinzel font-bold text-2xs sm:text-xs px-2.5 sm:px-4 py-2 rounded-lg transition flex items-center gap-1 bg-amber-50/60 text-slate-700 hover:bg-amber-100 border border-amber-200 whitespace-nowrap";
                        view.classList.add('hidden');
                    }
                }
            });
            window.renderActiveView();
        };

        window.toggleTask = function(taskId) {
            const key = `task_${window.currentBranch}_${taskId}`;
            const currentState = localStorage.getItem(key) === 'true';
            localStorage.setItem(key, (!currentState).toString());
            window.renderActiveView();
        };

        window.setCarStatus = function(carId, status) {
            localStorage.setItem(`car_${carId}`, status);
            window.renderActiveView();
        };

        function isTaskDone(taskId) {
            return localStorage.getItem(`task_${window.currentBranch}_${taskId}`) === 'true';
        }

        function getCarStatus(carId) {
            return localStorage.getItem(`car_${carId}`) || 'STANDBY';
        }

        function getCurrentMinutes() {
            const now = new Date();
            return now.getHours() * 60 + now.getMinutes();
        }

        function getEventStatus(event, nowMin) {
            const allDone = event.tasks.every((_, idx) => isTaskDone(`${event.id}_${idx}`));
            if (allDone) return 'DONE';
            if (nowMin >= event.startMin && nowMin < event.startMin + 30) return 'NOW';
            return 'PENDING';
        }

        window.renderActiveView = function() {
            if (window.currentTab === 'agenda') renderAgendaView();
            else if (window.currentTab === 'details') renderDetailsView();
            else if (window.currentTab === 'transport') renderTransportView();
            else if (window.currentTab === 'checklist') renderChecklistView();
        };

        function renderAgendaView() {
            const container = document.getElementById('tab-view-agenda');
            const events = window.currentBranch === 'TEMPLE' ? templeEvents : receptionEvents;
            const nowMin = getCurrentMinutes();

            let html = `<div class="space-y-3">`;
            events.forEach(evt => {
                const status = getEventStatus(evt, nowMin);
                let statusBadge = `<span class="px-2 py-0.5 rounded text-3xs font-bold border border-slate-300 bg-slate-100 text-slate-700">⬜ PENDING</span>`;
                if (status === 'NOW') {
                    statusBadge = `<span class="px-2 py-0.5 rounded text-3xs font-bold border border-yellow-500 bg-amber-300 text-amber-950 animate-pulse">🟡 NOW HAPPENING</span>`;
                } else if (status === 'DONE') {
                    statusBadge = `<span class="px-2 py-0.5 rounded text-3xs font-bold border border-emerald-500 bg-emerald-100 text-emerald-800">✅ COMPLETED</span>`;
                }

                const cardStyle = evt.highlight 
                    ? "bg-gradient-to-r from-amber-50 via-yellow-50 to-amber-50 border-2 border-amber-500 gold-glow rounded-xl p-3 sm:p-4 shadow-sm relative overflow-hidden" 
                    : "bg-white border border-amber-300/70 rounded-xl p-3 sm:p-4 shadow-2xs hover:border-amber-400 transition";

                const doneCount = evt.tasks.filter((_, idx) => isTaskDone(`${evt.id}_${idx}`)).length;

                html += `
                    <div class="${cardStyle}">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-1.5">
                            <div class="flex items-center gap-2">
                                <span class="bg-amber-100 text-amber-950 border border-amber-400 px-2.5 py-0.5 rounded-lg text-2xs sm:text-xs font-mono font-bold whitespace-nowrap">
                                    ⏰ ${evt.time}
                                </span>
                                ${statusBadge}
                            </div>
                            <span class="text-3xs font-bold text-amber-800 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded-full w-fit">
                                Tasks: ${doneCount} / ${evt.tasks.length} Done
                            </span>
                        </div>
                        <h3 class="font-cinzel font-bold text-xs sm:text-base text-amber-950 ${evt.highlight ? 'text-amber-900 font-black' : ''}">
                            ${evt.highlight ? '💍 ' : ''}${evt.title}
                        </h3>
                        <p class="text-2xs sm:text-xs text-slate-600 mt-1">${evt.desc}</p>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

                { id: 'c6', pos: 'POS 2', type: 'BRIDE CONVOY', car: 'TOYOTA VELLFIRE', plate: 'PLR 1111', driver: 'Michael', passengers: 'Mr Sathiya, Ms Uma, Deepa' },
                { id: 'c7', pos: 'POS 3 (EARLY DEPARTURE)', type: 'BRIDE CONVOY', car: 'MANO UNCLE VAN (9-SEATER)', plate: 'VLV 3181', driver: 'Mano Uncle Team', passengers: 'Tata, Amama, Atte, Mama, Ravi, Saanjey, Vijay, Dhivya (Departs early to hall)' }
            ];

            let html = `
                <div class="space-y-4">
                    <div class="bg-amber-800 text-white p-3 rounded-xl shadow-xs text-center font-cinzel text-xs font-bold border border-amber-600">
                        🚗 TEMPLE WEDDING CAR CONVOY & REVERSE PARKING MANAGEMENT
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            `;

            cars.forEach(c => {
                const st = getCarStatus(c.id);
                let badgeClass = "bg-slate-200 text-slate-800";
                if (st === 'READY') badgeClass = "bg-blue-100 text-blue-800 border-blue-300";
                if (st === 'DEPARTED') badgeClass = "bg-amber-100 text-amber-900 border-amber-300";
                if (st === 'ARRIVED') badgeClass = "bg-emerald-100 text-emerald-900 border-emerald-300";

                html += `
                    <div class="bg-white border border-amber-300 rounded-xl p-3 shadow-2xs space-y-2">
                        <div class="flex items-center justify-between border-b border-amber-100 pb-1.5">
                            <span class="text-3xs font-bold font-mono px-2 py-0.5 bg-amber-100 text-amber-950 rounded border border-amber-300">
                                ${c.pos}
                            </span>
                            <span class="text-3xs font-bold px-2 py-0.5 rounded border ${badgeClass}">
                                STATUS: ${st}
                            </span>
                        </div>
                        <div class="flex items-center justify-between">
                            <h4 class="font-cinzel font-bold text-sm text-amber-950">${c.car}</h4>
                            <span class="font-mono text-xs font-bold text-slate-700 bg-slate-100 px-2 py-0.5 rounded border border-slate-300">${c.plate}</span>
                        </div>
                        <div class="text-2xs text-slate-700 space-y-0.5">
                            <div><strong>🚘 Driver:</strong> ${c.driver}</div>
                            <div><strong>👥 Passengers:</strong> ${c.passengers}</div>
                        </div>
                        <div class="pt-2 border-t border-amber-100 flex items-center justify-between gap-1 text-3xs font-bold">
                            <button onclick="window.setCarStatus('${c.id}', 'STANDBY')" class="px-2 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 border">STANDBY</button>
                            <button onclick="window.setCarStatus('${c.id}', 'READY')" class="px-2 py-1 rounded bg-blue-50 hover:bg-blue-100 text-blue-800 border border-blue-300">READY</button>
                            <button onclick="window.setCarStatus('${c.id}', 'DEPARTED')" class="px-2 py-1 rounded bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-300">DEPARTED</button>
                            <button onclick="window.setCarStatus('${c.id}', 'ARRIVED')" class="px-2 py-1 rounded bg-emerald-50 hover:bg-emerald-100 text-emerald-900 border border-emerald-300">ARRIVED</button>
                        </div>
                    </div>
                `;
            });

            html += `
                    </div>

                    <!-- SPARE CARS & TEMPLE PARKING RULES -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4">
                        <div class="bg-white p-3 rounded-xl border border-amber-300 text-2xs space-y-1">
                            <h4 class="font-cinzel font-bold text-xs text-amber-950 border-b border-amber-200 pb-1 mb-1">🚘 SPARE CARS</h4>
                            <div>• CAMRY: <strong>PJL 2899</strong></div>
                            <div>• MAZDA: <strong>PPA 564</strong></div>
                        </div>
                        <div class="bg-amber-900 text-amber-50 p-3 rounded-xl border border-amber-600 text-2xs space-y-1">
                            <h4 class="font-cinzel font-bold text-xs text-amber-200 border-b border-amber-700 pb-1 mb-1">🅿️ TEMPLE INSIDE PARKING (8 CARS)</h4>
                            <div class="leading-relaxed">
                                VHR 1111, VMP 1111, CEH 1111, SAB 1111 V, SAB 1111 H, PLR 1111, SK 1991 C (Peripa Vellfire), ANJ 1991 (BMW X5).
                            </div>
                            <div class="text-amber-300 font-bold mt-1 text-3xs">
                                ⚠️ ALL 6 MAIN CARS MUST BE REVERSE PARKED ACCORDING TO CONVOY ORDER ONCE REACHED AT TEMPLE.
                            </div>
                        </div>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        function renderChecklistView() {
            const container = document.getElementById('tab-view-checklist');
            const events = window.currentBranch === 'TEMPLE' ? templeEvents : receptionEvents;

            let totalTasks = 0;
            let doneTasks = 0;

            events.forEach(evt => {
                evt.tasks.forEach((_, idx) => {
                    totalTasks++;
                    if (isTaskDone(`${evt.id}_${idx}`)) doneTasks++;
                });
            });

            const percent = totalTasks > 0 ? Math.round((doneTasks / totalTasks) * 100) : 0;

            let html = `
                <!-- SIMPLE PROGRESS COUNTER -->
                <div class="bg-gradient-to-r from-amber-950 via-amber-900 to-amber-950 text-amber-100 p-4 rounded-xl border border-amber-400 shadow-sm text-center space-y-2 mb-4">
                    <div class="font-cinzel font-bold text-xs text-amber-300 tracking-wider">
                        ${window.currentBranch} WEDDING PROGRESS
                    </div>
                    <div class="text-xl sm:text-2xl font-mono font-black text-yellow-300">
                        ${doneTasks} / ${totalTasks} TASKS COMPLETED (${percent}%)
                    </div>
                    <div class="w-full bg-amber-950 rounded-full h-3 border border-amber-600 p-0.5">
                        <div class="bg-gradient-to-r from-yellow-400 to-amber-500 h-full rounded-full transition-all duration-500" style="width: ${percent}%"></div>
                    </div>
                </div>

                <div class="space-y-4">
            `;

            events.forEach(evt => {
                const cardStyle = evt.highlight 
                    ? "bg-amber-50/90 border-2 border-amber-500 gold-glow rounded-xl p-3.5 sm:p-4 shadow-sm" 
                    : "bg-white border border-amber-300/80 rounded-xl p-3.5 sm:p-4 shadow-2xs";

                html += `
                    <div class="${cardStyle}">
                        <div class="flex items-center justify-between border-b border-amber-200 pb-2 mb-2">
                            <span class="font-mono text-2xs font-bold text-amber-950 bg-amber-100 px-2 py-0.5 rounded border border-amber-300">
                                ⏰ ${evt.time}
                            </span>
                            <span class="font-cinzel font-bold text-2xs text-amber-900 uppercase">
                                ${evt.title}
                            </span>
                        </div>
                        <div class="space-y-2">
                `;

                evt.tasks.forEach((tk, idx) => {
                    const taskId = `${evt.id}_${idx}`;
                    const done = isTaskDone(taskId);
                    html += `
                        <button onclick="window.toggleTask('${taskId}')" class="w-full text-left flex items-center gap-3 p-2.5 rounded-lg border transition ${done ? 'bg-emerald-50 border-emerald-300 text-emerald-950' : 'bg-slate-50 border-slate-200 text-slate-800 hover:bg-amber-50'}">
                            <span class="w-6 h-6 flex items-center justify-center rounded-md border text-sm font-bold ${done ? 'bg-emerald-600 text-white border-emerald-700' : 'bg-white text-slate-400 border-slate-300'}">
                                ${done ? '✓' : ''}
                            </span>
                            <span class="text-xs sm:text-sm font-medium ${done ? 'line-through text-emerald-800 font-bold' : ''}">
                                ${tk}
                            </span>
                        </button>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function updateLiveClock() {
            const clockEl = document.getElementById('live-clock-display');
            if (clockEl) {
                const now = new Date();
                clockEl.innerText = now.toLocaleTimeString('en-US', { hour12: true });
            }
        }

        function updateCountdowns() {
            const now = new Date().getTime();
            const templeTime = new Date('2026-08-23T09:15:00').getTime();
            const recTime = new Date('2026-08-24T18:00:00').getTime();

            const templeDiff = Math.max(0, templeTime - now);
            const recDiff = Math.max(0, recTime - now);

            // Temple Countdown
            const td = Math.floor(templeDiff / (1000 * 60 * 60 * 24));
            const th = Math.floor((templeDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const tm = Math.floor((templeDiff % (1000 * 60 * 60)) / (1000 * 60));
            const ts = Math.floor((templeDiff % (1000 * 60)) / 1000);

            const tdEl = document.getElementById('cd-temple-d');
            const thEl = document.getElementById('cd-temple-h');
            const tmEl = document.getElementById('cd-temple-m');
            const tsEl = document.getElementById('cd-temple-s');

            if (tdEl) tdEl.innerText = String(td).padStart(2, '0');
            if (thEl) thEl.innerText = String(th).padStart(2, '0');
            if (tmEl) tmEl.innerText = String(tm).padStart(2, '0');
            if (tsEl) tsEl.innerText = String(ts).padStart(2, '0');

            // Reception Countdown
            const rd = Math.floor(recDiff / (1000 * 60 * 60 * 24));
            const rh = Math.floor((recDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const rm = Math.floor((recDiff % (1000 * 60 * 60)) / (1000 * 60));
            const rs = Math.floor((recDiff % (1000 * 60)) / 1000);

            const rdEl = document.getElementById('cd-rec-d');
            const rhEl = document.getElementById('cd-rec-h');
            const rmEl = document.getElementById('cd-rec-m');
            const rsEl = document.getElementById('cd-rec-s');

            if (rdEl) rdEl.innerText = String(rd).padStart(2, '0');
            if (rhEl) rhEl.innerText = String(rh).padStart(2, '0');
            if (rmEl) rmEl.innerText = String(rm).padStart(2, '0');
            if (rsEl) rsEl.innerText = String(rs).padStart(2, '0');
        }

        // Initialize App on Window Load
        window.onload = function() {
            updateLiveClock();
            updateCountdowns();
            setInterval(updateLiveClock, 1000);
            setInterval(updateCountdowns, 1000);
            window.renderActiveView();
        };
    </script>
</body>
</html>
