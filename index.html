        }

        }

        .gold-border {
            border: 1.5px solid #D4AF37;
        }

        .gold-border-thick {
            border: 2px solid #D4AF37;
        }

        }

        // LOCAL STORAGE STATE KEYS
        var STORAGE_KEY_TASKS = 'nk_wedding_tasks_v2';
        var STORAGE_KEY_CAR_STATUS = 'nk_wedding_car_status_v2';
        var STORAGE_KEY_BRANCH = 'nk_wedding_branch_v2';
        
        var savedTasks = JSON.parse(localStorage.getItem(STORAGE_KEY_TASKS) || '{}');
        var savedCarStatus = JSON.parse(localStorage.getItem(STORAGE_KEY_CAR_STATUS) || '{}');
        var currentBranch = localStorage.getItem(STORAGE_KEY_BRANCH) || 'TEMPLE';
        var currentTab = 'AGENDA';

        function getCurrentMinutes() {
            var d = new Date();
            return d.getHours() * 60 + d.getMinutes();
        }

        function isTaskDone(evtId, idx) {
            return !!savedTasks[evtId + '_' + idx];
        }

        function saveTaskState() {
            localStorage.setItem(STORAGE_KEY_TASKS, JSON.stringify(savedTasks));
        }

        function getCarStatus(carId) {
            return savedCarStatus[carId] || 'STANDBY';
        }

        function setCarStatus(carId, status) {
            savedCarStatus[carId] = status;
            localStorage.setItem(STORAGE_KEY_CAR_STATUS, JSON.stringify(savedCarStatus));
            renderAllViews();
        }

        function getEventProgress(evt) {
            var done = 0;
            var total = evt.todo ? evt.todo.length : 0;
            for (var i = 0; i < total; i++) {
                if (isTaskDone(evt.id, i)) done++;
            }
            return {
                done: done,
                total: total,
                isAllDone: total > 0 && done === total
            };
        }

        function getEventsList() {
            return currentBranch === 'RECEPTION' ? RECEPTION_EVENTS : WEDDING_EVENTS;
        }

        function switchBranch(branch) {
            currentBranch = branch;
            localStorage.setItem(STORAGE_KEY_BRANCH, branch);

            var templeBtn = document.getElementById('branch-btn-temple');
            var receptionBtn = document.getElementById('branch-btn-reception');
            var banner = document.getElementById('branch-info-banner');

            if (branch === 'TEMPLE') {
                if (templeBtn) templeBtn.className = "px-3.5 py-1.5 rounded-full text-xs font-bold transition font-cinzel shadow-xs bg-amber-600 text-white border border-amber-700";
                if (receptionBtn) receptionBtn.className = "px-3.5 py-1.5 rounded-full text-xs font-bold transition font-cinzel shadow-xs bg-white text-amber-900 border border-amber-400 hover:bg-amber-50";
                if (banner) banner.innerHTML = "📅 23 AUGUST 2026 | 📍 Jalan Baru Muniswarar Temple, Perai, Penang";
            } else {
                if (receptionBtn) receptionBtn.className = "px-3.5 py-1.5 rounded-full text-xs font-bold transition font-cinzel shadow-xs bg-amber-600 text-white border border-amber-700";
                if (templeBtn) templeBtn.className = "px-3.5 py-1.5 rounded-full text-xs font-bold transition font-cinzel shadow-xs bg-white text-amber-900 border border-amber-400 hover:bg-amber-50";
                if (banner) banner.innerHTML = "📅 24 AUGUST 2026 | 📍 Ballroom 3, PICCA Convention Centre (#CynNavTiedInLove)";
            }
            renderAllViews();
        }

        function switchTab(tab) {
            currentTab = tab;
            var tabs = ['AGENDA', 'DETAILS', 'TRANSPORT', 'CHECKLIST'];
            tabs.forEach(function(t) {
                var btn = document.getElementById('tab-btn-' + t.toLowerCase());
                var view = document.getElementById('tab-view-' + t.toLowerCase());
                if (btn && view) {
                    if (t === tab) {
                        btn.className = "active-tab flex-1 py-2.5 px-1 sm:px-3 rounded-xl font-cinzel font-bold text-xs sm:text-sm tracking-wider transition text-center flex items-center justify-center gap-1";
                        view.classList.remove('hidden');
                    } else {
                        btn.className = "inactive-tab flex-1 py-2.5 px-1 sm:px-3 rounded-xl font-cinzel font-bold text-xs sm:text-sm tracking-wider transition text-center flex items-center justify-center gap-1";
                        view.classList.add('hidden');
                    }
                }
            });
            renderAllViews();
        }

        function getOverallMetrics() {
            var totalTasks = 0;
            var completedTasks = 0;
            var activeEvents = getEventsList();

            activeEvents.forEach(function(evt) {
                totalTasks += evt.todo ? evt.todo.length : 0;
                if (evt.todo) {
                    for (var i = 0; i < evt.todo.length; i++) {
                        if (isTaskDone(evt.id, i)) completedTasks++;
                    }
                }
            });

            var percent = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;
            return { total: totalTasks, completed: completedTasks, percent: percent };
        }

        function renderAgendaView() {
            var currentMins = getCurrentMinutes();
            var activeEvents = getEventsList();
            var html = '<div class="space-y-3">';

            activeEvents.forEach(function(evt) {
                var prog = getEventProgress(evt);
                var isNow = currentMins >= evt.startMins && currentMins <= evt.endMins;
                
                var statusBadge = prog.isAllDone 
                    ? '<span class="px-3 py-1 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-full">✅ DONE</span>'
                    : isNow 
                    ? '<span class="px-3 py-1 bg-amber-400 text-slate-900 text-xs font-bold rounded-full animate-pulse">🟡 NOW</span>'
                    : '<span class="px-3 py-1 bg-slate-100 text-slate-600 text-xs font-semibold rounded-full">⬜ PENDING</span>';

                var cardBg = evt.isTalli 
                    ? 'gold-glow-card' 
                    : isNow 
                    ? 'bg-amber-50/70 gold-border' 
                    : prog.isAllDone 
                    ? 'bg-emerald-50/40 border border-emerald-200' 
                    : 'bg-white border border-slate-200';

                html += 
                    '<div class="p-4 rounded-2xl transition flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-2xs ' + cardBg + '">' +
                        '<div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-3.5 flex-1 min-w-0">' +
                            '<div class="inline-flex items-center justify-center bg-white px-3 py-1 rounded-lg gold-border font-mono font-bold text-amber-900 text-xs sm:text-sm shrink-0 w-fit whitespace-nowrap shadow-2xs">' +
                                '⏰ ' + evt.time +
                            '</div>' +
                            '<div class="flex-1 min-w-0">' +
                                '<div class="font-cinzel font-bold text-slate-900 text-base sm:text-lg break-words">' + 
                                    (evt.isTalli ? '💍 ' : '') + evt.title + 
                                '</div>' +
                                '<div class="text-xs text-slate-500 mt-0.5">' +
                                    'Tasks: <span class="font-bold text-slate-700">' + prog.done + ' / ' + prog.total + ' Completed</span>' +
                                '</div>' +
                            '</div>' +
                        '</div>' +
                        '<div class="flex items-center justify-between sm:justify-end gap-2 pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-100 shrink-0">' +
                            statusBadge +
                        '</div>' +
                    '</div>';
            });

            html += '</div>';
            var elem = document.getElementById('tab-view-agenda');
            if (elem) elem.innerHTML = html;
        }

        function renderDetailsView() {
            var activeEvents = getEventsList();
            var html = '<div class="space-y-6">';

            activeEvents.forEach(function(evt) {
                var todoItemsHtml = evt.todo ? evt.todo.map(function(item) {
                    return '<li class="flex items-start gap-2 text-xs sm:text-sm text-slate-700"><span class="text-amber-500">▪</span><span>' + item + '</span></li>';
                }).join('') : '';

                var responsibleHtml = evt.responsible ? evt.responsible.map(function(role) {
                    return '<span class="px-2.5 py-1 bg-amber-50 border border-amber-200 text-amber-900 text-xs font-bold rounded-md">👤 ' + role + '</span>';
                }).join('') : '';

                var peopleHtml = evt.people ? evt.people.map(function(person) {
                    return '<span class="px-2.5 py-1 bg-slate-100 text-slate-800 text-xs font-medium rounded-md">👥 ' + person + '</span>';
                }).join('') : '';

                var walkingHtml = evt.walkingList ? evt.walkingList.map(function(step) {
                    return '<li class="text-xs text-slate-700 font-medium">' + step + '</li>';
                }).join('') : '';

                var cardBg = evt.isTalli ? 'gold-glow-card' : 'bg-white gold-border shadow-xs';

                html += 
                    '<div class="p-5 rounded-2xl space-y-4 ' + cardBg + '">' +
                        '<div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-amber-200 pb-3 gap-2">' +
                            '<span class="px-3 py-1 bg-amber-100 text-amber-900 font-mono font-bold text-xs rounded-md w-fit shrink-0">⏰ ' + evt.time + '</span>' +
                            '<h3 class="font-cinzel font-bold text-slate-900 text-lg sm:text-xl flex-1">' + (evt.isTalli ? '💍 ' : '') + evt.title + '</h3>' +
                        '</div>' +

                        '<!-- TO DO LIST -->' +
                        (todoItemsHtml ? 
                            '<div class="space-y-1.5">' +
                                '<div class="text-xs font-bold text-amber-900 uppercase tracking-wider">📋 TO DO</div>' +
                                '<ul class="space-y-1 pl-1">' + todoItemsHtml + '</ul>' +
                            '</div>' : '') +

                        '<!-- RESPONSIBLE LEADERS -->' +
                        (responsibleHtml ? 
                            '<div class="space-y-1.5 pt-2 border-t border-slate-100">' +
                                '<div class="text-xs font-bold text-amber-900 uppercase tracking-wider">👑 RESPONSIBLE LEADERS (PIC)</div>' +
                                '<div class="flex flex-wrap gap-1.5">' + responsibleHtml + '</div>' +
                            '</div>' : '') +

                        '<!-- PEOPLE INVOLVED -->' +
                        (peopleHtml ? 
                            '<div class="space-y-1.5">' +
                                '<div class="text-xs font-bold text-slate-500 uppercase tracking-wider">👥 PEOPLE INVOLVED</div>' +
                                '<div class="flex flex-wrap gap-1.5">' + peopleHtml + '</div>' +
                            '</div>' : '') +

                        '<!-- WALKING LIST / PROCESSION -->' +
                        (walkingHtml ? 
                            '<div class="space-y-1.5 bg-amber-50/50 p-3 rounded-xl border border-amber-200/60">' +
                                '<div class="text-xs font-bold text-amber-900 uppercase tracking-wider">🚶 WALKING LIST / PROCESSION ORDER</div>' +
                                '<ul class="space-y-1 pl-1 list-none">' + walkingHtml + '</ul>' +
                            '</div>' : '') +

                        '<!-- SONG / LED / IMPORTANT INSTRUCTIONS -->' +
                        (evt.song ? '<div class="text-xs text-slate-800 bg-amber-50 p-2.5 rounded-lg border border-amber-200 font-medium">🎵 <b>SONG:</b> ' + evt.song + '</div>' : '') +
                        (evt.led ? '<div class="text-xs text-slate-800 bg-slate-50 p-2.5 rounded-lg border border-slate-200 font-medium">📺 <b>LED:</b> ' + evt.led + '</div>' : '') +
                        (evt.important ? '<div class="text-xs text-amber-950 bg-amber-100/80 p-2.5 rounded-lg border border-amber-300 font-semibold">⚠️ <b>IMPORTANT:</b> ' + evt.important + '</div>' : '') +
                    '</div>';
            });

            html += '</div>';
            var elem = document.getElementById('tab-view-details');
            if (elem) elem.innerHTML = html;
        }

        function renderTransportView() {
            var html = '';

            if (currentBranch === 'RECEPTION') {
                html = 
                    '<div class="bg-white p-6 rounded-2xl gold-border shadow-xs space-y-3 text-center">' +
                        '<div class="text-3xl">🍸</div>' +
                        '<h2 class="font-cinzel font-bold text-slate-900 text-lg sm:text-xl">RECEPTION TRANSPORTATION PROTOCOL</h2>' +
                        '<p class="text-xs text-slate-600 max-w-md mx-auto leading-relaxed">' +
                            'Car convoy sequence applies exclusively to the <b>Temple Wedding (23 Aug)</b>. For the Reception at PICCA Convention Centre (24 Aug), Bride & Groom and Royalties will arrive directly at designated entrance suites.' +
                        '</p>' +
                        '<div class="pt-2 flex justify-center">' +
                            '<button onclick="switchBranch(\'TEMPLE\')" class="px-4 py-2 bg-amber-600 text-white font-bold rounded-xl text-xs font-cinzel shadow-xs hover:bg-amber-700 transition">' +
                                '🛕 VIEW TEMPLE CAR CONVOY LIST' +
                            '</button>' +
                        '</div>' +
                    '</div>';
                var elem = document.getElementById('tab-view-transport');
                if (elem) elem.innerHTML = html;
                return;
            }

            html = 
                '<div class="bg-white p-5 rounded-2xl gold-border shadow-xs space-y-2 text-center">' +
                    '<h2 class="font-cinzel font-black text-slate-900 text-lg sm:text-xl">🚗 WEDDING CAR CONVOY & DRIVER DASHBOARD</h2>' +
                    '<p class="text-xs text-slate-500">Real-time tracking of assigned drivers (Saccin, Victor, Shankar, Michael, Senthil, Mano Uncle Team), license plates, and exact passenger allocations.</p>' +
                '</div>' +

                '<!-- CONVOY POSITIONING SUMMARY CARD -->' +
                '<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">' +
                    '<div class="bg-amber-50/70 p-4 rounded-2xl gold-border space-y-2">' +
                        '<div class="font-cinzel font-bold text-amber-900 text-sm border-b border-amber-200 pb-1">🚘 GROOM CONVOY ORDER (HOUSE ➔ HALL)</div>' +
                        '<ol class="text-xs space-y-1 font-semibold text-slate-800">' +
                            '<li>1. <b>Porsche (SAB 1111 V)</b> — Driver: Saccin</li>' +
                            '<li>2. <b>Denza (VMP 1111)</b> — Driver: Victor</li>' +
                            '<li>3. <b>Toyota Alphard (VHR 1111)</b> — Driver: Mano Uncle Team</li>' +
                            '<li>4. <b>Mercedes S-Class (CEH 1111)</b> — Driver: Senthil</li>' +
                        '</ol>' +
                    '</div>' +

                    '<div class="bg-amber-50/70 p-4 rounded-2xl gold-border space-y-2">' +
                        '<div class="font-cinzel font-bold text-amber-900 text-sm border-b border-amber-200 pb-1">🚘 BRIDE CONVOY ORDER (HOTEL ➔ HALL)</div>' +
                        '<ol class="text-xs space-y-1 font-semibold text-slate-800">' +
                            '<li>1. <b>BMW i7 (SAB 1111 H)</b> — Driver: Shankar</li>' +
                            '<li>2. <b>Toyota Vellfire (PLR 1111)</b> — Driver: Michael</li>' +
                            '<li>3. <b>Mano Uncle Van 9-Seater (VLV 3181)</b> — Departs Early</li>' +
                        '</ol>' +
                    '</div>' +
                '</div>' +

                '<div class="space-y-4 pt-4">';

            CAR_CONVOY_LIST.forEach(function(car) {
                var status = getCarStatus(car.id);

                var statusClasses = {
                    'READY': 'bg-blue-100 text-blue-900 border-blue-300',
                    'DEPARTED': 'bg-amber-100 text-amber-900 border-amber-300 animate-pulse',
                    'ARRIVED': 'bg-emerald-100 text-emerald-900 border-emerald-300',
                    'STANDBY': 'bg-slate-100 text-slate-700 border-slate-300'
                };

                var passengersHtml = car.passengers.map(function(p) {
                    return '<span class="px-2 py-0.5 bg-slate-100 text-slate-800 text-xs font-medium rounded border border-slate-200">' + p + '</span>';
                }).join(' ');

                html += 
                    '<div class="p-5 bg-white rounded-2xl gold-border shadow-xs space-y-3">' +
                        '<div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-amber-200 pb-3 gap-2">' +
                            '<div>' +
                                '<span class="px-2.5 py-1 bg-amber-100 text-amber-900 font-mono font-bold text-xs rounded-md">' + car.plate + '</span>' +
                                '<h3 class="font-cinzel font-bold text-slate-900 text-base sm:text-lg inline-block ml-2">' + car.role + '</h3>' +
                            '</div>' +
                            '<span class="px-3 py-1 rounded-full text-xs font-bold border self-start sm:self-auto ' + statusClasses[status] + '">' +
                                'STATUS: ' + status +
                            '</span>' +
                        '</div>' +

                        '<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">' +
                            '<div><b>🚘 Vehicle Model:</b> <span class="text-slate-700 font-medium">' + car.model + '</span></div>' +
                            '<div><b>👨‍✈️ Driver:</b> <span class="text-amber-900 font-bold">' + car.driver + '</span></div>' +
                            '<div><b>📍 Route & Type:</b> <span class="text-slate-700 font-medium">' + car.route + '</span></div>' +
                            '<div><b>⏰ Convoy Position:</b> <span class="text-slate-900 font-bold">' + car.position + '</span></div>' +
                        '</div>' +

                        '<div class="space-y-1 pt-1 border-t border-slate-100 text-xs">' +
                            '<div class="font-bold text-slate-500 uppercase tracking-wider">👥 PASSENGER ALLOCATION</div>' +
                            '<div class="flex flex-wrap gap-1.5">' + passengersHtml + '</div>' +
                        '</div>' +

                        '<div class="pt-2 border-t border-slate-100 flex flex-wrap items-center gap-2">' +
                            '<span class="text-xs font-bold text-slate-500 mr-1">CHANGE STATUS:</span>' +
                            '<button onclick="setCarStatus(\'' + car.id + '\', \'READY\')" class="px-3 py-1 bg-blue-50 text-blue-700 hover:bg-blue-100 font-bold rounded-lg text-xs border border-blue-200 transition">READY</button>' +
                            '<button onclick="setCarStatus(\'' + car.id + '\', \'DEPARTED\')" class="px-3 py-1 bg-amber-50 text-amber-700 hover:bg-amber-100 font-bold rounded-lg text-xs border border-amber-200 transition">DEPARTED</button>' +
                            '<button onclick="setCarStatus(\'' + car.id + '\', \'ARRIVED\')" class="px-3 py-1 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 font-bold rounded-lg text-xs border border-emerald-200 transition">ARRIVED</button>' +
                            '<button onclick="setCarStatus(\'' + car.id + '\', \'STANDBY\')" class="px-3 py-1 bg-slate-50 text-slate-600 hover:bg-slate-100 font-bold rounded-lg text-xs border border-slate-200 transition">STANDBY</button>' +
                        '</div>' +
                    '</div>';
            });

            html += '</div>';

            // SPARE CARS SECTION
            html += 
                '<div class="mt-6 p-5 bg-white rounded-2xl gold-border space-y-3 shadow-xs">' +
                    '<div class="font-cinzel font-bold text-slate-900 text-base border-b border-amber-200 pb-2">🚗 SPARE VEHICLES</div>' +
                    '<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">' +
                        SPARE_CARS.map(function(sc) {
                            return '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200 flex items-center justify-between">' +
                                '<div><b>' + sc.model + '</b></div>' +
                                '<span class="px-2 py-0.5 bg-amber-100 text-amber-900 font-mono font-bold rounded text-xs">' + sc.plate + '</span>' +
                            '</div>';
                        }).join('') +
                    '</div>' +
                '</div>';

            // TEMPLE PARKING ALLOCATION SECTION
            html += 
                '<div class="mt-4 p-5 bg-white rounded-2xl gold-border space-y-3 shadow-xs">' +
                    '<div class="font-cinzel font-bold text-slate-900 text-base border-b border-amber-200 pb-2 flex items-center justify-between">' +
                        '<span>🅿️ TEMPLE INSIDE PARKING (8 RESERVED SPOTS)</span>' +
                        '<span class="text-xs font-sans text-amber-800 bg-amber-100 px-2 py-0.5 rounded">REVERSE PARK REQUIRED</span>' +
                    '</div>' +
                    '<p class="text-xs text-slate-600">⚠️ <b>IMPORTANT INSTRUCTION:</b> All 6 convoy cars MUST be reverse parked according to convoy order once reached at the temple. The van will be parked elsewhere after drop off.</p>' +
                    '<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2.5 pt-1 text-xs">' +
                        TEMPLE_PARKING_LIST.map(function(tp) {
                            return '<div class="p-2.5 bg-amber-50/60 rounded-xl border border-amber-200 space-y-1">' +
                                '<div class="font-bold text-amber-900">Spot #' + tp.spot + ' — ' + tp.model + '</div>' +
                                '<div class="font-mono text-slate-700 text-[11px] font-bold">' + tp.plate + '</div>' +
                            '</div>';
                        }).join('') +
                    '</div>' +
                '</div>';

            var elem = document.getElementById('tab-view-transport');
            if (elem) elem.innerHTML = html;
        }

        function renderChecklistView() {
            var metrics = getOverallMetrics();
            var activeEvents = getEventsList();

            var html = 
                '<!-- SIMPLE TOP PROGRESS SUMMARY -->' +
                '<div class="bg-white p-5 rounded-2xl gold-border shadow-xs space-y-3 text-center">' +
                    '<div class="text-xs font-bold text-amber-800 uppercase tracking-widest">' + (currentBranch === 'RECEPTION' ? 'RECEPTION PROGRESS (24 AUG)' : 'TEMPLE WEDDING PROGRESS (23 AUG)') + '</div>' +
                    '<div class="text-2xl sm:text-3xl font-black font-mono text-slate-900">' + 
                        metrics.completed + ' / ' + metrics.total + ' TASKS COMPLETED (' + metrics.percent + '%)' + 
                    '</div>' +
                    '<div class="w-full bg-slate-100 rounded-full h-3.5 overflow-hidden gold-border p-0.5">' +
                        '<div class="bg-amber-400 h-2.5 rounded-full transition-all duration-500" style="width: ' + metrics.percent + '%"></div>' +
                    '</div>' +
                '</div>' +
                '<div class="space-y-6 mt-4">';

            activeEvents.forEach(function(evt) {
                var cardBg = evt.isTalli ? 'gold-glow-card' : 'bg-white gold-border shadow-xs';

                var tasksHtml = evt.todo ? evt.todo.map(function(taskText, idx) {
                    var done = isTaskDone(evt.id, idx);
                    var itemBg = done ? 'bg-emerald-50 border-emerald-200 text-emerald-900 line-through font-medium' : 'bg-slate-50 border-slate-200 text-slate-800 font-semibold';
                    var checkedAttr = done ? 'checked' : '';

                    return '<label class="flex items-center gap-3.5 p-3 sm:p-4 rounded-xl transition cursor-pointer border ' + itemBg + '">' +
                        '<input type="checkbox" ' + checkedAttr + ' onchange="toggleTask(\'' + evt.id + '\', ' + idx + ')" class="large-checkbox">' +
                        '<span class="text-sm sm:text-base flex-1">' + taskText + '</span>' +
                        (done ? '<span class="text-xs font-bold text-emerald-600 no-underline whitespace-nowrap">✅ DONE</span>' : '') +
                    '</label>';
                }).join('') : '';

                html += 
                    '<div class="p-5 rounded-2xl space-y-3 ' + cardBg + '">' +
                        '<div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-amber-200 pb-2.5 gap-2">' +
                            '<span class="px-3 py-1 bg-amber-100 text-amber-900 font-mono font-bold text-xs rounded-md w-fit shrink-0">⏰ ' + evt.time + '</span>' +
                            '<h3 class="font-cinzel font-bold text-slate-900 text-base sm:text-lg flex-1">' + (evt.isTalli ? '💍 ' : '') + evt.title + '</h3>' +
                        '</div>' +
                        '<div class="space-y-2.5 pt-1">' + tasksHtml + '</div>' +
                    '</div>';
            });

            html += 
                '</div>' +
                '<div class="pt-4 flex justify-center">' +
                    '<button onclick="openResetModal()" class="px-4 py-2 text-slate-400 hover:text-slate-600 font-cinzel font-bold text-xs rounded-xl transition underline">' +
                        'RESET ALL CHECKLIST' +
                    '</button>' +
                '</div>';

            var elem = document.getElementById('tab-view-checklist');
            if (elem) elem.innerHTML = html;
        }

        function toggleTask(evtId, taskIdx) {
            var key = evtId + '_' + taskIdx;
            savedTasks[key] = !savedTasks[key];
            saveTaskState();

            var metrics = getOverallMetrics();
            if (metrics.percent === 100 && typeof confetti === 'function') {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }

            renderAllViews();
        }

        function openResetModal() {
            var modal = document.getElementById('reset-modal');
            if (modal) modal.classList.remove('hidden');
        }

        function closeResetModal() {
            var modal = document.getElementById('reset-modal');
            if (modal) modal.classList.add('hidden');
        }

        function executeResetAll() {
            savedTasks = {};
            savedCarStatus = {};
            localStorage.removeItem(STORAGE_KEY_TASKS);
            localStorage.removeItem(STORAGE_KEY_CAR_STATUS);
            closeResetModal();
            renderAllViews();
        }

        function renderAllViews() {
            if (currentTab === 'AGENDA') renderAgendaView();
            else if (currentTab === 'DETAILS') renderDetailsView();
            else if (currentTab === 'TRANSPORT') renderTransportView();
            else if (currentTab === 'CHECKLIST') renderChecklistView();
        }

        function updateCountdowns() {
            var now = new Date().getTime();
            
            // Temple Wedding: Aug 23, 2026 09:15:00
            var templeTarget = new Date('2026-08-23T09:15:00').getTime();
            var templeDiff = templeTarget - now;
            var templeElem = document.getElementById('countdown-temple');
            if (templeElem) {
                if (templeDiff > 0) {
                    var d = Math.floor(templeDiff / (1000 * 60 * 60 * 24));
                    var h = Math.floor((templeDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    var m = Math.floor((templeDiff % (1000 * 60 * 60)) / (1000 * 60));
                    var s = Math.floor((templeDiff % (1000 * 60)) / 1000);
                    templeElem.innerHTML = d + 'd ' + String(h).padStart(2,'0') + 'h ' + String(m).padStart(2,'0') + 'm ' + String(s).padStart(2,'0') + 's';
                } else {
                    templeElem.innerHTML = "🎉 EVENT LIVE!";
                }
            }

            // Reception: Aug 24, 2026 18:00:00
            var receptionTarget = new Date('2026-08-24T18:00:00').getTime();
            var receptionDiff = receptionTarget - now;
            var receptionElem = document.getElementById('countdown-reception');
            if (receptionElem) {
                if (receptionDiff > 0) {
                    var rd = Math.floor(receptionDiff / (1000 * 60 * 60 * 24));
                    var rh = Math.floor((receptionDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    var rm = Math.floor((receptionDiff % (1000 * 60 * 60)) / (1000 * 60));
                    var rs = Math.floor((receptionDiff % (1000 * 60)) / 1000);
                    receptionElem.innerHTML = rd + 'd ' + String(rh).padStart(2,'0') + 'h ' + String(rm).padStart(2,'0') + 'm ' + String(rs).padStart(2,'0') + 's';
                } else {
                    receptionElem.innerHTML = "🎉 EVENT LIVE!";
                }
            }
        }

        // BIND FUNCTIONS EXPLICITLY TO WINDOW FOR INLINE HTML ONCLICK ATTRIBUTES
        window.switchBranch = switchBranch;
        window.switchTab = switchTab;
        window.setCarStatus = setCarStatus;
        window.toggleTask = toggleTask;
        window.openResetModal = openResetModal;
        window.closeResetModal = closeResetModal;
        window.executeResetAll = executeResetAll;
        window.renderAllViews = renderAllViews;
        window.renderAgendaView = renderAgendaView;
        window.renderDetailsView = renderDetailsView;
        window.renderTransportView = renderTransportView;
        window.renderChecklistView = renderChecklistView;
        window.updateCountdowns = updateCountdowns;

        // BOOT INITIAL RENDER ON WINDOW LOAD
        window.onload = function() {
            switchBranch(currentBranch);
            renderAllViews();
            updateCountdowns();
            setInterval(updateCountdowns, 1000);
        };
    </script>
</body>
</html>
